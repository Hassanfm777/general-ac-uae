<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
let cart={};try{cart=JSON.parse(localStorage.getItem("gc_cart")||"{}")}catch(e){}
function save(){try{localStorage.setItem("gc_cart",JSON.stringify(cart))}catch(e){}}
function render(){
 const k=Object.keys(cart);$("cn").textContent=k.reduce((a,m)=>a+cart[m],0);
 $("items").innerHTML=k.length?k.map(m=>`<div class="li"><b>${m}</b><span class="q"><button data-d="-1" data-m="${m}" aria-label="Less">−</button>${cart[m]}<button data-d="1" data-m="${m}" aria-label="More">+</button></span></div>`).join(""):'<p class="note">Your list is empty. Choose models with Add in the table.</p>';
 save();
}
function open(o){$("cart").classList.toggle("open",o);$("cart").setAttribute("aria-hidden",!o)}
$("cb").onclick=()=>open(true);$("cx").onclick=()=>open(false);
document.addEventListener("keydown",e=>{if(e.key=="Escape")open(false)});
$("rows").addEventListener("click",e=>{const m=e.target.dataset&&e.target.dataset.m;if(!m)return;cart[m]=(cart[m]||0)+1;render();open(true)});
$("items").addEventListener("click",e=>{const m=e.target.dataset.m;if(!m)return;cart[m]+=+e.target.dataset.d;if(cart[m]<1)delete cart[m];render()});
function text(){
 const k=Object.keys(cart);
 if(!k.length){$("msg").textContent="Add at least one model.";return null}
 if(!$("nm").value.trim()||!$("ph").value.trim()){$("msg").textContent="Enter your name and phone.";return null}
 $("msg").textContent="";
 return "Quote request, O GENERAL split ACs\n"+k.map(m=>"- "+m+" x"+cart[m]).join("\n")+"\n\nName: "+$("nm").value+"\nPhone: "+$("ph").value+"\nLocation: "+$("ad").value+"\nNotes: "+$("nt").value;
}
$("wa").onclick=()=>{const t=text();if(t)window.open("https://wa.me/971502746100?text="+encodeURIComponent(t),"_blank","noopener")};
$("em").onclick=()=>{const t=text();if(t)location.href="mailto:info@generalcool.ae?subject="+encodeURIComponent("Quote request")+"&body="+encodeURIComponent(t)};
render();

// tilt cards
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.querySelectorAll(".type").forEach(c=>{
 c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*12}deg) rotateX(${-y*12}deg) translateZ(6px)`});
 c.addEventListener("mouseleave",()=>c.style.transform="");
});

// 3D scene
try{
 if(!window.THREE)throw 0;
 const st=$("stage"),cv=$("c"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(38,1,.1,100);C.position.set(0,.3,10.5);
 S.add(new THREE.AmbientLight(0xffffff,.75));const L=new THREE.DirectionalLight(0xffffff,.9);L.position.set(4,5,6);S.add(L);
 const M=(c,r=.4)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:.1});
 const G=new THREE.Group();S.add(G);
 const ind=new THREE.Group();ind.position.set(0,1.4,0);G.add(ind);
 const add=(p,g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};

 // --- Indoor AC Main Body & Details ---
 add(ind,new THREE.BoxGeometry(4.4,1.3,1.05),M(0xf6f8fa),0,0,0);
 add(ind,new THREE.BoxGeometry(4.3,.14,1),M(0xd5dbe0),0,.7,0);
 add(ind,new THREE.BoxGeometry(3.9,.2,.9),M(0x3a4650),0,-.62,.05);
 const lv=add(ind,new THREE.BoxGeometry(3.8,.05,.55),M(0xe9edf0),0,-.78,.3);lv.rotation.x=.55;
 add(ind,new THREE.BoxGeometry(.9,.07,.02),M(0xd92d27),-1.4,.15,.53);
 add(ind,new THREE.SphereGeometry(.05,12,12),new THREE.MeshBasicMaterial({color:0x2be07a}),1.8,-.2,.53);

 // --- ADDING THE OPTIMUS PRIME LOGO TO FRONT CENTER OF INDOOR UNIT ---
 const loader = new THREE.TextureLoader();
 loader.load('images/optimus-prime-logo-red.png', function(texture) {
   const logoMat = new THREE.MeshStandardMaterial({
     map: texture,
     transparent: true,
     roughness: 0.3
   });
   // Plane for the logo placed slightly in front of the AC panel (z = 0.535)
   const logoPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), logoMat);
   logoPlane.position.set(0, 0.05, 0.535);
   ind.add(logoPlane);
 });

 // --- Outdoor Unit ---
 const out=new THREE.Group();out.position.set(-2.2,-2.7,.4);G.add(out);
 add(out,new THREE.BoxGeometry(2.1,1.7,.9),M(0xe4e8ec),0,0,0);
 add(out,new THREE.CylinderGeometry(.7,.7,.06,40),M(0x2d3640),0,0,.47).rotation.x=Math.PI/2;
 add(out,new THREE.TorusGeometry(.72,.035,10,48),M(0x1f7a3a),0,0,.5);
 const fan=new THREE.Group();fan.position.set(0,0,.52);out.add(fan);
 for(let i=0;i<3;i++){const b=add(fan,new THREE.BoxGeometry(.6,.2,.02),M(0x8b97a3),0,0,0);b.position.set(Math.cos(i*2.094)*.3,Math.sin(i*2.094)*.3,0);b.rotation.z=i*2.094}
 add(out,new THREE.BoxGeometry(2.1,.08,.95),M(0xc3cad1),0,.88,0);

 const rings=[],mat=()=>new THREE.MeshBasicMaterial({color:0x37b6ff,transparent:true});
 for(let i=0;i<6;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.5,.02,6,48),mat());r.rotation.x=Math.PI/2.4;ind.add(r);rings.push(r)}
 const fl=[];for(let i=0;i<16;i++){const f=new THREE.Mesh(new THREE.IcosahedronGeometry(.09,0),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true}));f.position.set((Math.random()-.5)*8,(Math.random()-.5)*6,Math.random()*3-1);f.userData.s=.2+Math.random()*.4;S.add(f);fl.push(f)}
 let mx=0,my=0,t=0;const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 st.addEventListener("pointermove",e=>{const r=st.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5});
 function size(){const w=st.clientWidth,h=st.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
 addEventListener("resize",size);size();
 function loop(){
  t+=.016;
  if(!still){G.rotation.y+=((mx*.9+Math.sin(t*.5)*.25)-G.rotation.y)*.05;G.rotation.x+=((my*.35)-G.rotation.x)*.05;fan.rotation.z-=.25;
    rings.forEach((r,i)=>{const p=((t*.5+i/6)%1);r.position.set(0,-.8-p*3.2,.4+p*1.6);r.scale.set(3.4+p*1.2,1+p,1);r.material.opacity=(1-p)*.7});
    fl.forEach(f=>{f.position.y-=f.userData.s*.01;f.rotation.x+=.01;f.rotation.y+=.012;if(f.position.y<-3.5)f.position.y=3.5})}
  R.render(S,C);requestAnimationFrame(loop)}
 loop();document.querySelector(".fb").style.display="none";
}catch(e){cv.style.display="none"}
})();
</script>
